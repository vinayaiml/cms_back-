name: Backend Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-tests.yml'
  push:
    branches:
      - dev
      - main
      - 'task/**'
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-tests.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whizrobot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whizrobot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/whizrobot_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/whizrobot_test?schema=public
      JWT_SECRET: ci-backend-test-jwt-secret
      JWT_EXPIRES_IN: 7d
      LICENSE_SECRET_KEY: ci-backend-test-license-secret-32chars
      REDIS_ENABLED: 'false'
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run backend test suite
        run: npm run test:ci

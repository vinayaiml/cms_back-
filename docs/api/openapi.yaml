openapi: 3.0.3
info:
  title: WhizRobot CMS API
  version: 1.0.0
  description: |
    Official API contract for Android, CMS frontend, and CMS/backend development.

    This contract is versioned at docs/api/openapi.yaml. Changes to API paths,
    request bodies, response bodies, auth behavior, or error formats should be
    reviewed with this file.

    Version 1 baseline routes live under /api/v1. The approved legacy test
    routes without /v1 are deprecated and planned for removal in API v2.
servers:
  - url: http://localhost:3001/api
    description: Local backend
tags:
  - name: Auth
  - name: Robot
  - name: Organizations
  - name: Users
  - name: Roles
  - name: Permissions
  - name: Capabilities
  - name: Subscription Plans
    description: Subscription plan catalogue and configured capability membership.
  - name: Dashboard
  - name: Content
  - name: Course Access
  - name: Notifications
  - name: Analytics
  - name: Audit
security:
  - bearerAuth: []
paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginUserV1
      summary: User login
      description: Authenticates a CMS user or administrator and returns a user JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              superAdmin:
                value:
                  email: superadmin@whizrobo.com
                  password: "<password>"
      responses:
        "201":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginResponse"
              examples:
                success:
                  value:
                    token: "<jwt>"
                    user:
                      id: 1
                      email: superadmin@whizrobo.com
                      fullName: Super Admin
                      orgId: null
                      isSuperAdmin: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/robot/auth/login:
    post:
      tags: [Robot]
      operationId: loginRobotV1
      summary: Robot login by license key and Sanbot robot ID
      description: Authenticates a robot by tester-entered license key and the Sanbot robot ID sent as serialNumber, stores safe device metadata, and returns a short-lived robot access token plus refresh token. Expired, revoked and inactive-organization cases receive the domain locked error.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RobotLoginRequest"
            examples:
              robot:
                value:
                  licenseKey: WHRB900001
                  serialNumber: TEST-ACTIVE-001
                  deviceMetadata:
                    manufacturer: Sanbot
                    model: Mini ELF
                    androidVersion: 7.1.2
                    apiLevel: 25
                    appVersionName: 0.1.0
                    appVersionCode: 2
      responses:
        "201":
          description: Robot login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotLoginResponse"
              examples:
                success:
                  value:
                    token: "<robot-access-jwt>"
                    accessToken: "<robot-access-jwt>"
                    refreshToken: "<robot-refresh-jwt>"
                    expiresIn: 900
                    refreshExpiresIn: 604800
                    tokenType: Bearer
                    robot:
                      id: 10
                      orgId: 1
                      serialNumber: TEST-ACTIVE-001
                      name: Demo Robot
                    license:
                      validFrom: "2026-01-01T00:00:00.000Z"
                      validUntil: "2027-01-01T00:00:00.000Z"
                      status: ACTIVE
                      locked: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid robot credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidLicense:
                  value:
                    statusCode: 401
                    message: Invalid robot credentials
                    error: Unauthorized
                serialMismatch:
                  value:
                    statusCode: 401
                    message: Invalid robot credentials
                    error: Unauthorized
        "423":
          description: Robot login is locked by license or organization state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockedErrorResponse"
              examples:
                expired:
                  value:
                    error:
                      code: LICENSE_EXPIRED
                      message: Robot license is expired
                      locked: true
                revoked:
                  value:
                    error:
                      code: LICENSE_REVOKED
                      message: Robot license is revoked
                      locked: true
                orgInactive:
                  value:
                    error:
                      code: ORG_INACTIVE
                      message: Organization is inactive
                      locked: true
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/robot/auth/refresh:
    post:
      tags: [Robot]
      operationId: refreshRobotTokenV1
      summary: Renew robot access token
      description: Exchanges a valid robot refresh token for a new short-lived robot access token. Refresh tokens are not accepted by sync or log upload endpoints.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RobotTokenRefreshRequest"
            examples:
              refresh:
                value:
                  refreshToken: "<robot-refresh-jwt>"
      responses:
        "201":
          description: Robot access token renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotTokenRefreshResponse"
              examples:
                success:
                  value:
                    token: "<robot-access-jwt>"
                    accessToken: "<robot-access-jwt>"
                    expiresIn: 900
                    tokenType: Bearer
                    robot:
                      id: 10
                      orgId: 1
                      serialNumber: TEST-ACTIVE-001
                      name: Demo Robot
                    license:
                      validFrom: "2026-01-01T00:00:00.000Z"
                      validUntil: "2027-01-01T00:00:00.000Z"
                      status: ACTIVE
                      locked: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidRefreshToken:
                  value:
                    statusCode: 401
                    message: Invalid refresh token
                    error: Unauthorized
        "423":
          description: Robot refresh is locked by license or organization state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockedErrorResponse"
              examples:
                expired:
                  value:
                    error:
                      code: LICENSE_EXPIRED
                      message: Robot license is expired
                      locked: true
                revoked:
                  value:
                    error:
                      code: LICENSE_REVOKED
                      message: Robot license is revoked
                      locked: true
                orgInactive:
                  value:
                    error:
                      code: ORG_INACTIVE
                      message: Organization is inactive
                      locked: true
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/robot/sync:
    get:
      tags: [Robot]
      operationId: syncRobotV1
      summary: Get robot sync/configuration payload
      description: Returns the robot license state, assigned courses and public catalog content for the authenticated robot. Updates the robot last-seen timestamp and, when supplied, safe app version/device model heartbeat fields.
      security:
        - robotBearerAuth: []
      parameters:
        - name: X-Robot-App-Version
          in: header
          required: false
          schema:
            type: string
            maxLength: 40
            pattern: "^[0-9A-Za-z._+-]+$"
          example: 0.1.0
          description: Optional Android app version heartbeat. Stored on the authenticated robot record only.
        - name: X-Robot-App-Version-Code
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
          example: 2
          description: Optional Android app version code heartbeat used to evaluate app update policy fields.
        - name: X-Robot-Device-Model
          in: header
          required: false
          schema:
            type: string
            maxLength: 80
            pattern: "^[0-9A-Za-z._+() -]+$"
          example: Mini ELF
          description: Optional robot model heartbeat. Stored on the authenticated robot record only.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            maxLength: 80
          example: '"d7f8c2c4e2c0a4fef0d8f6c6a0a8d8d28e4ad8be1f5f4e8c5a9c9a89d4b9b7b2"'
          description: Optional manifest ETag from the previous successful sync. Matching values return 304 Not Modified.
      responses:
        "200":
          description: Sync payload
          headers:
            ETag:
              description: Stable manifest hash for conditional sync requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotSyncResponse"
              examples:
                success:
                  value:
                    schemaVersion: 1
                    manifestVersion: "1.0.0"
                    locked: false
                    tenant:
                      orgId: 1
                      orgName: Demo School
                      displayName: Demo School
                      logoUrl: https://assets.whizrobo.test/orgs/demo-school-logo.png
                      primaryColor: "#1D4ED8"
                      secondaryColor: "#F97316"
                      tenantVersion: 1
                      cacheVersion: org-1-v1
                    license:
                      status: ACTIVE
                      validFrom: "2026-01-01T00:00:00.000Z"
                      validUntil: "2027-01-01T00:00:00.000Z"
                    capabilities:
                      schemaVersion: 1
                      resolver: cms-entitlements-v1
                      effective:
                        - id: 1
                          stableKey: audio.speaker
                          name: Speaker Output
                          category: audio
                          version: 1
                          requiredHardware:
                            capabilities: [speaker]
                    policies:
                      schemaVersion: 1
                      offlineCache:
                        enabled: true
                        scope: tenant
                        cacheVersion: org-1-v1
                      sync:
                        fullSyncRequired: false
                        retryAfterSeconds: 30
                      appUpdate:
                        minimumSupportedVersionName: 0.1.0
                        minimumSupportedVersionCode: 1
                        recommendedVersionName: 0.1.0
                        recommendedVersionCode: 1
                        currentVersionCode: 2
                        updateRequired: false
                        updateRecommended: false
                    contentVersions:
                      cacheVersion: org-1-v1
                      tenantVersion: 1
                      myCoursesVersion: my-courses-org-1-v1-0
                      publicCatalogVersion: public-catalog-v1-0
                      myCoursesCount: 0
                      publicCatalogCount: 0
                    sync:
                      serverTime: "2026-08-27T00:00:00.000Z"
                      syncedAt: "2026-08-27T00:00:00.000Z"
                      idempotencyKey: robot-10-org-1-org-1-v1
                      configVersion: manifest-2a6a21d85d7d0b7c
                      manifestHash: 2a6a21d85d7d0b7c6fd7f21f012de62987b19b0f7a61c73ce6f3b42a72da6f34
                    organization:
                      orgId: 1
                      orgName: Demo School
                      displayName: Demo School
                      logoUrl: https://assets.whizrobo.test/orgs/demo-school-logo.png
                      primaryColor: "#1D4ED8"
                      secondaryColor: "#F97316"
                      tenantVersion: 1
                      cacheVersion: org-1-v1
                    entitlements:
                      subscription:
                        status: ACTIVE
                        planId: 2
                        planStableKey: speech-plus
                        planVersion: 1
                        validFrom: "2026-09-01T00:00:00.000Z"
                        validUntil: "2027-09-01T00:00:00.000Z"
                      paidCapabilities:
                        - id: 1
                          stableKey: audio.speaker
                          name: Speaker Output
                          category: audio
                          version: 1
                          requiredHardware:
                            capabilities: [speaker]
                    myCourses: []
                    publicCatalog: []
                    syncedAt: "2026-08-27T00:00:00.000Z"
        "304":
          description: Manifest not modified. Response body is empty; keep the cached manifest for the authenticated robot tenant.
          headers:
            ETag:
              description: Current stable manifest hash.
              schema:
                type: string
        "400":
          description: Invalid robot heartbeat header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidHeartbeat:
                  value:
                    statusCode: 400
                    message: x-robot-app-version is invalid
                    error: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/robot/sync/changes:
    get:
      tags: [Robot]
      operationId: getRobotSyncChangesV1
      summary: Get incremental robot sync changes
      description: Returns only changed bootstrap manifest sections when the robot provides a previous manifest ETag and section versions. Returns 304 when the manifest is unchanged, or requiresFullSync when the client baseline is missing or unsupported.
      security:
        - robotBearerAuth: []
      parameters:
        - name: X-Robot-App-Version
          in: header
          required: false
          schema:
            type: string
            maxLength: 40
            pattern: "^[0-9A-Za-z._+-]+$"
          example: 0.1.0
          description: Optional Android app version heartbeat. Stored on the authenticated robot record only.
        - name: X-Robot-App-Version-Code
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
          example: 2
          description: Optional Android app version code heartbeat used to evaluate app update policy fields.
        - name: X-Robot-Device-Model
          in: header
          required: false
          schema:
            type: string
            maxLength: 80
            pattern: "^[0-9A-Za-z._+() -]+$"
          example: Mini ELF
          description: Optional robot model heartbeat. Stored on the authenticated robot record only.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            maxLength: 80
          example: '"2a6a21d85d7d0b7c6fd7f21f012de62987b19b0f7a61c73ce6f3b42a72da6f34"'
          description: Previous manifest ETag/hash. Matching values return 304 Not Modified.
        - name: X-Robot-Cache-Version
          in: header
          required: false
          schema:
            type: string
            maxLength: 120
          example: org-1-v1
          description: Cached tenant/cache version from the previous manifest.
        - name: X-Robot-Tenant-Version
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
          example: 1
          description: Cached tenantVersion from the previous manifest.
        - name: X-Robot-My-Courses-Version
          in: header
          required: false
          schema:
            type: string
            maxLength: 120
          example: my-courses-org-1-v1-0
          description: Cached myCoursesVersion from the previous manifest.
        - name: X-Robot-Public-Catalog-Version
          in: header
          required: false
          schema:
            type: string
            maxLength: 120
          example: public-catalog-v1-0
          description: Cached publicCatalogVersion from the previous manifest.
      responses:
        "200":
          description: Incremental manifest changes or full-sync fallback instruction
          headers:
            ETag:
              description: Stable current manifest hash.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotSyncChangesResponse"
              examples:
                partialPublicCatalogChange:
                  value:
                    schemaVersion: 1
                    manifestVersion: "1.0.0"
                    locked: false
                    currentManifestHash: 2a6a21d85d7d0b7c6fd7f21f012de62987b19b0f7a61c73ce6f3b42a72da6f34
                    currentConfigVersion: manifest-2a6a21d85d7d0b7c
                    requiresFullSync: false
                    contentVersions:
                      cacheVersion: org-1-v1
                      tenantVersion: 1
                      myCoursesVersion: my-courses-org-1-v1-0
                      publicCatalogVersion: public-catalog-v1-1
                      myCoursesCount: 0
                      publicCatalogCount: 1
                    changed:
                      publicCatalog:
                        - id: 201
                          courseCode: PUBLIC-INTRO
                          courseName: Public Intro
                      license:
                        status: ACTIVE
                        validFrom: "2026-01-01T00:00:00.000Z"
                        validUntil: "2027-01-01T00:00:00.000Z"
                    sync:
                      serverTime: "2026-08-27T00:00:00.000Z"
                      syncedAt: "2026-08-27T00:00:00.000Z"
                      idempotencyKey: robot-10-org-1-org-1-v1
                      configVersion: manifest-2a6a21d85d7d0b7c
                      manifestHash: 2a6a21d85d7d0b7c6fd7f21f012de62987b19b0f7a61c73ce6f3b42a72da6f34
                fullSyncRequired:
                  value:
                    schemaVersion: 1
                    manifestVersion: "1.0.0"
                    locked: false
                    currentManifestHash: 2a6a21d85d7d0b7c6fd7f21f012de62987b19b0f7a61c73ce6f3b42a72da6f34
                    currentConfigVersion: manifest-2a6a21d85d7d0b7c
                    requiresFullSync: true
                    fullSyncReason: MISSING_OR_UNSUPPORTED_CLIENT_VERSIONS
                    contentVersions:
                      cacheVersion: org-1-v1
                      tenantVersion: 1
                      myCoursesVersion: my-courses-org-1-v1-0
                      publicCatalogVersion: public-catalog-v1-0
                      myCoursesCount: 0
                      publicCatalogCount: 0
                    changed: {}
                    sync:
                      serverTime: "2026-08-27T00:00:00.000Z"
                      syncedAt: "2026-08-27T00:00:00.000Z"
                      idempotencyKey: robot-10-org-1-org-1-v1
                      configVersion: manifest-2a6a21d85d7d0b7c
                      manifestHash: 2a6a21d85d7d0b7c6fd7f21f012de62987b19b0f7a61c73ce6f3b42a72da6f34
        "304":
          description: Manifest not modified. Response body is empty; keep the cached manifest for the authenticated robot tenant.
          headers:
            ETag:
              description: Current stable manifest hash.
              schema:
                type: string
        "400":
          description: Invalid incremental sync header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/robot/device-profile:
    put:
      tags: [Robot]
      operationId: updateRobotDeviceProfileV1
      summary: Update current robot device and hardware profile
      description: Robot-authenticated endpoint for Android to upload the latest approved app version, device model/manufacturer, Android version/API level and validated hardware profile. The full payload is required; invalid or stale partial payloads are rejected before stored profile values are overwritten.
      security:
        - robotBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RobotDeviceProfileUpdateRequest"
            examples:
              miniElf:
                value:
                  manufacturer: Sanbot
                  deviceModel: Mini ELF
                  androidVersion: 7.1.2
                  apiLevel: 25
                  appVersionName: 0.1.0
                  appVersionCode: 2
                  hardwareProfile:
                    model: MINI_ELF
                    manufacturer: Sanbot
                    androidApiLevel: 25
                    abi: arm64-v8a
                    display:
                      width: 1920
                      height: 1200
                    capabilities:
                      camera: true
                      autonomousNavigation: true
                      armMotion: true
      responses:
        "200":
          description: Device profile accepted and stored on the authenticated robot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotDeviceProfileUpdateResponse"
              examples:
                updated:
                  value:
                    robot:
                      id: 1
                      orgId: 1
                      serialNumber: TEST-ACTIVE-001
                      name: Robot 1 (ACTIVE)
                      licenseStatus: ACTIVE
                      validFrom: "2026-01-01T00:00:00.000Z"
                      validUntil: "2027-01-01T00:00:00.000Z"
                      revokedAt: null
                      lastSeenAt: "2026-09-19T10:00:00.000Z"
                      appVersion: 0.1.0
                      deviceModel: Mini ELF
                      deviceMetadata:
                        schemaVersion: 2
                        storage: approved-device-profile
                        manufacturer: Sanbot
                        model: Mini ELF
                        androidVersion: 7.1.2
                        apiLevel: 25
                        appVersionName: 0.1.0
                        appVersionCode: 2
                      hardwareModel: MINI_ELF
                      hardwareProfile:
                        schemaVersion: 1
                        model: MINI_ELF
                        label: Mini ELF
                        manufacturer: Sanbot
                        androidApiLevel: 25
                        abi: arm64-v8a
                        display:
                          width: 1920
                          height: 1200
                      hardwareCapabilities:
                        camera: true
                        microphone: true
                        speaker: true
                        touchDisplay: true
                        videoPlayback: true
                        speechRecognition: true
                        autonomousNavigation: false
                        armMotion: false
                      updatedAt: "2026-09-19T10:00:00.000Z"
                    license:
                      status: ACTIVE
                      validFrom: "2026-01-01T00:00:00.000Z"
                      validUntil: "2027-01-01T00:00:00.000Z"
                    updatedAt: "2026-09-19T10:00:00.000Z"
        "400":
          description: Invalid device or hardware profile payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidHardware:
                  value:
                    statusCode: 400
                    message: Invalid robot hardware Android API level
                    error: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/robot/logs/batch:
    post:
      tags: [Robot]
      operationId: uploadRobotLogsBatchV1
      summary: Upload robot usage logs
      description: Accepts robot usage events. Duplicate `(robotId, eventId)` submissions are accepted without inserting duplicates.
      security:
        - robotBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUsageLogsRequest"
            examples:
              oneLog:
                value:
                  logs:
                    - eventId: thunder-test-001
                      courseId: 1
                      lessonId: 1
                      openedAt: "2026-08-31T10:00:00.000Z"
                      durationSec: 60
              minimalLog:
                value:
                  logs:
                    - eventId: thunder-test-002
                      openedAt: "2026-08-31T10:05:00.000Z"
                      durationSec: 30
      responses:
        "201":
          description: Logs accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUsageLogsResponse"
              examples:
                success:
                  value:
                    inserted: 1
                duplicate:
                  value:
                    inserted: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/robot/ai/conversation:
    post:
      tags: [Robot]
      operationId: converseRobotAiV1
      summary: Robot AI conversation gateway
      description: |
        Processes speech or text conversation for an authenticated robot via backend AI gateway.
        Provider credentials remain strictly on the backend. Approved AI tools (organization info,
        staff directory, appointment booking, safety-checked movement) are executed subject to
        tenant isolation, active license checks, and safety limits.
      security:
        - robotBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RobotConversationRequest"
            examples:
              askOrgInfo:
                value:
                  message: "Hello! Who is the principal here?"
                  sessionId: "sess-8a9b0c"
                  contextReferences:
                    location: "Reception"
                    screen: "HOME"
      responses:
        "200":
          description: AI conversation response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotConversationResponse"
              examples:
                successWithTool:
                  value:
                    conversationId: "c7e12720-3c5e-4bb5-8fa9-43c2fa4b840e"
                    reply: "Welcome to Whiz Academy! Our principal is Dr. Sharma. How may I assist you?"
                    speechText: "Welcome to Whiz Academy! How may I assist you?"
                    action: null
                    toolExecutions:
                      - toolName: "getApprovedOrganisationInformation"
                        status: "EXECUTED"
                    fallbackUsed: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:

openapi: 3.0.3
info:
  title: WhizRobot CMS API
  version: 1.0.0
  description: |
    Official API contract for Android, CMS frontend, and CMS/backend development.

    This contract is versioned at docs/api/openapi.yaml. Changes to API paths,
    request bodies, response bodies, auth behavior, or error formats should be
    reviewed with this file.

    Version 1 baseline routes live under /api/v1. The approved legacy test
    routes without /v1 are deprecated and planned for removal in API v2.
servers:
  - url: http://localhost:3001/api
    description: Local backend
tags:
  - name: Auth
  - name: Robot
  - name: Organizations
  - name: Users
  - name: Roles
  - name: Permissions
  - name: Dashboard
  - name: Content
  - name: Course Access
  - name: Notifications
  - name: Analytics
security:
  - bearerAuth: []
paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              superAdmin:
                value:
                  email: superadmin@whizrobo.com
                  password: '<password>'
      responses:
        '201':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
              examples:
                success:
                  value:
                    token: '<jwt>'
                    user:
                      id: 1
                      email: superadmin@whizrobo.com
                      fullName: Super Admin
                      orgId: null
                      isSuperAdmin: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/robot/auth/login:
    post:
      tags: [Robot]
      summary: Robot login by license key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RobotLoginRequest'
            examples:
              robot:
                value:
                  licenseKey: '<license-key>'
      responses:
        '201':
          description: Robot login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotLoginResponse'
              examples:
                success:
                  value:
                    token: '<robot-jwt>'
                    robot:
                      id: 10
                      orgId: 1
                      serialNumber: WR-001
                      name: Demo Robot
                    license:
                      licenseKey: '<license-key>'
                      validFrom: '2026-01-01T00:00:00.000Z'
                      validUntil: '2027-01-01T00:00:00.000Z'
                      status: ACTIVE
                      locked: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/robot/sync:
    get:
      tags: [Robot]
      summary: Get robot sync/configuration payload
      security:
        - robotBearerAuth: []
      responses:
        '200':
          description: Sync payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotSyncResponse'
              examples:
                success:
                  value:
                    locked: false
                    license:
                      status: ACTIVE
                      validFrom: '2026-01-01T00:00:00.000Z'
                      validUntil: '2027-01-01T00:00:00.000Z'
                    myCourses: []
                    publicCatalog: []
                    syncedAt: '2026-08-27T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/robot/logs/batch:
    post:
      tags: [Robot]
      summary: Upload robot usage logs
      security:
        - robotBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUsageLogsRequest'
      responses:
        '201':
          description: Logs accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                success:
                  value:
                    ok: true
                    inserted: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Auth]
      summary: User login legacy route
      deprecated: true
      description: |
        Deprecated approved legacy test route. Use POST /api/v1/auth/login.
        Planned removal: API v2.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              superAdmin:
                value:
                  email: superadmin@whizrobo.com
                  password: '<password>'
      responses:
        '201':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
              examples:
                success:
                  value:
                    token: '<jwt>'
                    user:
                      id: 1
                      email: superadmin@whizrobo.com
                      fullName: Super Admin
                      orgId: null
                      isSuperAdmin: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /robot/auth/login:
    post:
      tags: [Robot]
      summary: Robot login legacy route
      deprecated: true
      description: |
        Deprecated approved legacy test route. Use POST /api/v1/robot/auth/login.
        Planned removal: API v2.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RobotLoginRequest'
            examples:
              robot:
                value:
                  licenseKey: '<license-key>'
      responses:
        '201':
          description: Robot login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotLoginResponse'
              examples:
                success:
                  value:
                    token: '<robot-jwt>'
                    robot:
                      id: 10
                      orgId: 1
                      serialNumber: WR-001
                      name: Demo Robot
                    license:
                      licenseKey: '<license-key>'
                      validFrom: '2026-01-01T00:00:00.000Z'
                      validUntil: '2027-01-01T00:00:00.000Z'
                      status: ACTIVE
                      locked: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /robot/sync:
    get:
      tags: [Robot]
      summary: Get robot sync/configuration payload legacy route
      deprecated: true
      description: |
        Deprecated approved legacy test route. Use GET /api/v1/robot/sync.
        Planned removal: API v2.
      security:
        - robotBearerAuth: []
      responses:
        '200':
          description: Sync payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotSyncResponse'
              examples:
                success:
                  value:
                    locked: false
                    license:
                      status: ACTIVE
                      validFrom: '2026-01-01T00:00:00.000Z'
                      validUntil: '2027-01-01T00:00:00.000Z'
                    myCourses: []
                    publicCatalog: []
                    syncedAt: '2026-08-27T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /robot/logs/batch:
    post:
      tags: [Robot]
      summary: Upload robot usage logs legacy route
      deprecated: true
      description: |
        Deprecated approved legacy test route. Use POST /api/v1/robot/logs/batch.
        Planned removal: API v2.
      security:
        - robotBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUsageLogsRequest'
      responses:
        '201':
          description: Logs accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                success:
                  value:
                    ok: true
                    inserted: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me:
    get:
      tags: [Dashboard]
      summary: Get current user profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/navigation:
    get:
      tags: [Dashboard]
      summary: Get navigation for current user
      responses:
        '200':
          description: Navigation sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardSection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orgs:
    get:
      tags: [Organizations]
      summary: List organizations
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
              examples:
                success:
                  value:
                    - id: 1
                      name: Demo School
                      state: Maharashtra
                      city: Mumbai
                      authorizedPersonName: Rajesh Kumar
                      contactNo: '9876543210'
                      isActive: true
                      createdAt: '2026-01-01T00:00:00.000Z'
                      updatedAt: '2026-01-01T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Organizations]
      summary: Create organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/me:
    get:
      tags: [Organizations]
      summary: Get current organization
      responses:
        '200':
          description: Current organization or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Organization'
                  - nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orgs/{id}:
    get:
      tags: [Organizations]
      summary: Get organization by ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Organizations]
      summary: Update organization
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Organizations]
      summary: Delete organization
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Deleted organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orgs/{id}/toggle-active:
    patch:
      tags: [Organizations]
      summary: Toggle organization active status
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orgs/{id}/permissions:
    get:
      tags: [Organizations]
      summary: List organization permissions
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Organizations]
      summary: Replace organization permission policy
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgPermissionsRequest'
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - name: orgId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{id}:
    patch:
      tags: [Users]
      summary: Update user
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Users]
      summary: Delete user
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/roles:
    post:
      tags: [Users]
      summary: Assign role to user
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '201':
          description: Role assigned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/permissions:
    post:
      tags: [Users]
      summary: Replace direct user permissions
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionKeys]
              properties:
                permissionKeys:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Permissions updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/toggle-lock:
    post:
      tags: [Users]
      summary: Toggle user lock status
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Lock status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  isLocked:
                    type: boolean
              examples:
                success:
                  value:
                    ok: true
                    isLocked: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /roles:
    get:
      tags: [Roles]
      summary: List roles
      parameters:
        - name: orgId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Roles]
      summary: Create role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /roles/{id}/permissions:
    post:
      tags: [Roles]
      summary: Add permission to role
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionRequest'
      responses:
        '201':
          description: Permission added
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Roles]
      summary: Remove permission from role
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionRequest'
      responses:
        '200':
          description: Permission removed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /permissions:
    get:
      tags: [Permissions]
      summary: List permissions
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Permissions]
      summary: Create permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'

  /permissions/catalog:
    get:
      tags: [Permissions]
      summary: List permission catalog
      responses:
        '200':
          description: Permission catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /robots:
    get:
      tags: [Robot]
      summary: List robots
      parameters:
        - name: orgId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Robots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Robot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Robot]
      summary: Create robot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRobotRequest'
      responses:
        '201':
          description: Robot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Robot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /robots/{id}/license/renew:
    put:
      tags: [Robot]
      summary: Renew robot license
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewLicenseRequest'
      responses:
        '200':
          description: Robot updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Robot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /robots/{id}/lock:
    put:
      tags: [Robot]
      summary: Lock or unlock robot
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:

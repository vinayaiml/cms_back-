components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    robotBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: integer
    OrgIdQuery:
      name: orgId
      in: query
      required: false
      schema:
        type: integer
    Days:
      name: days
      in: query
      required: false
      schema:
        type: integer
        default: 7
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 5
  requestBodies:
    FileUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
  responses:
    BadRequest:
      description: Bad request or validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                statusCode: 400
                message:
                  - email must be an email
                error: Bad Request
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              value:
                statusCode: 401
                message: Invalid credentials
                error: Unauthorized
    Forbidden:
      description: Authenticated principal is not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                statusCode: 403
                message: Insufficient permissions
                error: Forbidden
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            duplicate:
              value:
                statusCode: 409
                message: Admin email already exists
                error: Conflict
    Locked:
      description: Domain resource is locked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LockedErrorResponse'
          examples:
            orgInactive:
              value:
                error:
                  code: ORG_INACTIVE
                  message: Organization is inactive
                  locked: true
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            error:
              value:
                statusCode: 500
                message: Internal server error
    ImportResult:
      description: Import result
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          examples:
            success:
              value:
                ok: true
                created: 3
                updated: 0
                errors: []
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
    LockedErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, locked]
          properties:
            code:
              type: string
              example: ORG_INACTIVE
            message:
              type: string
              example: Organization is inactive
            locked:
              type: boolean
              example: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RobotLoginRequest:
      type: object
      required: [licenseKey]
      properties:
        licenseKey:
          type: string
    UserLoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    RobotLoginResponse:
      type: object
      required: [token, robot, license]
      properties:
        token:
          type: string
        robot:
          $ref: '#/components/schemas/Robot'
        license:
          $ref: '#/components/schemas/License'
    Organization:
      type: object
      required: [id, name, state, city, authorizedPersonName, contactNo, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        state:
          type: string
        city:
          type: string
        authorizedPersonName:
          type: string
        contactNo:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateOrganizationRequest:
      type: object
      required: [name, state, city, authorizedPersonName, contactNo, email]
      properties:
        name:
          type: string
        state:
          type: string
        city:
          type: string
        authorizedPersonName:
          type: string
        contactNo:
          type: string
        email:
          type: string
          format: email
    UpdateOrganizationRequest:
      type: object
      required: [name, state, city, authorizedPersonName, contactNo]
      properties:
        name:
          type: string
        state:
          type: string
        city:
          type: string
        authorizedPersonName:
          type: string
        contactNo:
          type: string
    UpdateOrgPermissionsRequest:
      type: object
      required: [permissionKeys]
      properties:
        permissionKeys:
          type: array
          items:
            type: string
    User:
      type: object
      properties:
        id:
          type: integer
        orgId:
          type: integer
          nullable: true
        email:
          type: string
          format: email
        fullName:
          type: string
        isSuperAdmin:
          type: boolean
        isLocked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [email, fullName, password]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        orgId:
          type: integer
        roleIds:
          type: array
          items:
            type: integer
        permissionKeys:
          type: array
          items:
            type: string
    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
    AssignRoleRequest:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: integer
    Role:
      type: object
      properties:
        id:
          type: integer
        orgId:
          type: integer
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    RolePermissionRequest:
      type: object
      required: [permissionKey]
      properties:
        permissionKey:
          type: string
    Permission:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
    CreatePermissionRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
        description:
          type: string
        category:
          type: string
    Robot:
      type: object
      properties:
        id:
          type: integer
        orgId:
          type: integer
        serialNumber:
          type: string
        name:
          type: string
          nullable: true
        licenseKey:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        licenseStatus:
          $ref: '#/components/schemas/LicenseStatus'
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
    CreateRobotRequest:
      type: object
      required: [serialNumber, validFrom, validUntil]
      properties:
        orgId:
          type: integer
        serialNumber:
          type: string
        name:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
    RenewLicenseRequest:
      type: object
      required: [validUntil]
      properties:
        validUntil:
          type: string
          format: date-time
    LockRobotRequest:
      type: object
      required: [lock]
      properties:
        lock:
          type: boolean
    License:
      type: object
      properties:
        licenseKey:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/LicenseStatus'
        locked:
          type: boolean
    LicenseStatus:
      type: string
      enum: [ACTIVE, EXPIRING_SOON, EXPIRED, REVOKED]
    RobotSyncResponse:
      type: object
      properties:
        locked:
          type: boolean
        reason:
          type: string
        license:
          type: object
          additionalProperties: true
        myCourses:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        publicCatalog:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        syncedAt:
          type: string
          format: date-time
    UploadUsageLogsRequest:

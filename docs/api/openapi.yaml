components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    robotBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: integer
    OrgIdQuery:
      name: orgId
      in: query
      required: false
      schema:
        type: integer
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    Days:
      name: days
      in: query
      required: false
      schema:
        type: integer
        default: 7
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 5
  requestBodies:
    FileUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
  responses:
    BadRequest:
      description: Bad request or validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              value:
                statusCode: 400
                message:
                  - email must be an email
                error: Bad Request
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              value:
                statusCode: 401
                message: Invalid credentials
                error: Unauthorized
    Forbidden:
      description: Authenticated principal is not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                statusCode: 403
                message: Insufficient permissions
                error: Forbidden
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            duplicate:
              value:
                statusCode: 409
                message: Admin email already exists
                error: Conflict
    Locked:
      description: Domain resource is locked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LockedErrorResponse'
          examples:
            orgInactive:
              value:
                error:
                  code: ORG_INACTIVE
                  message: Organization is inactive
                  locked: true
    TooManyRequests:
      description: Too many repeated authentication attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            throttled:
              value:
                statusCode: 429
                message: Too many login attempts. Try again later.
                error: Too Many Requests
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            error:
              value:
                statusCode: 500
                message: Internal server error
    ImportResult:
      description: Import result
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          examples:
            success:
              value:
                ok: true
                created: 3
                updated: 0
                errors: []
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
    LockedErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, locked]
          properties:
            code:
              type: string
              example: ORG_INACTIVE
            message:
              type: string
              example: Organization is inactive
            locked:
              type: boolean
              example: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RobotLoginRequest:
      type: object
      required: [licenseKey, serialNumber, deviceMetadata]
      additionalProperties: false
      properties:
        licenseKey:
          type: string
          minLength: 10
          maxLength: 10
          pattern: '^WHRB[0-9]{6}$'
          description: Robot activation value in WHRB plus six digits format. Never returned in login responses, logs or unauthorized robot resource APIs.
        serialNumber:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Sanbot robot ID fetched from device settings and paired with the registered license key.
        deviceMetadata:
          $ref: '#/components/schemas/RobotDeviceMetadata'
        deviceMetadataConsent:
          type: boolean
          description: Optional legacy field. If present, it must be true. Android robot clients may omit this field.
          enum: [true]
    RobotDeviceMetadata:
      type: object
      required: [manufacturer, model, androidVersion, apiLevel, appVersionName, appVersionCode]
      additionalProperties: false
      properties:
        manufacturer:
          type: string
          maxLength: 80
          example: Sanbot
        model:
          type: string
          maxLength: 80
          example: Mini ELF
        androidVersion:
          type: string
          maxLength: 32
          pattern: '^[0-9A-Za-z._ -]+$'
          example: 7.1.2
        apiLevel:
          type: integer
          minimum: 1
          example: 25
        appVersionName:
          type: string
          maxLength: 40
          pattern: '^[0-9A-Za-z._+-]+$'
          example: 0.1.0
        appVersionCode:
          type: integer
          minimum: 1
          example: 2
    UserLoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    RobotLoginResponse:
      type: object
      required: [token, accessToken, refreshToken, expiresIn, refreshExpiresIn, tokenType, robot, license]
      properties:
        token:
          type: string
          description: Deprecated compatibility alias for accessToken.
        accessToken:
          type: string
          description: Short-lived robot access token for sync and log upload.
        refreshToken:
          type: string
          description: Robot refresh token used only with POST /api/v1/robot/auth/refresh.
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
          example: 900
        refreshExpiresIn:
          type: integer
          description: Refresh token lifetime in seconds.
          example: 604800
        tokenType:
          type: string
          enum: [Bearer]
        robot:
          $ref: '#/components/schemas/Robot'
        license:
          $ref: '#/components/schemas/RobotLoginLicense'
    RobotTokenRefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Robot refresh token returned by robot login.
    RobotTokenRefreshResponse:
      type: object
      required: [token, accessToken, expiresIn, tokenType, robot, license]
      properties:
        token:
          type: string
          description: Deprecated compatibility alias for accessToken.
        accessToken:
          type: string
          description: New short-lived robot access token.
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
          example: 900
        tokenType:
          type: string
          enum: [Bearer]
        robot:
          $ref: '#/components/schemas/Robot'
        license:
          $ref: '#/components/schemas/RobotLoginLicense'
    Organization:
      type: object
      required: [id, name, state, city, authorizedPersonName, contactNo, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        state:
          type: string
        city:
          type: string
        authorizedPersonName:
          type: string
        contactNo:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:

    RobotBootstrapCapabilities:
      type: object
      required: [schemaVersion, effective, resolver]
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          example: 1
        resolver:
          type: string
          example: cms-entitlements-v1
        effective:
          type: array
          description: Effective capability set after subscription, organization overrides, robot assignment and hardware filtering.
          items:
            $ref: "#/components/schemas/EntitlementCapability"
    RobotBootstrapPolicies:
      type: object
      required: [schemaVersion, offlineCache, sync, appUpdate]
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          example: 1
        offlineCache:
          type: object
          required: [enabled, scope, cacheVersion]
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            scope:
              type: string
              enum: [tenant]
            cacheVersion:
              type: string
        sync:
          type: object
          required: [fullSyncRequired, retryAfterSeconds]
          additionalProperties: false
          properties:
            fullSyncRequired:
              type: boolean
            retryAfterSeconds:
              type: integer
              minimum: 0
        appUpdate:
          type: object
          required:
            [minimumSupportedVersionName, minimumSupportedVersionCode, recommendedVersionName, recommendedVersionCode, currentVersionCode, updateRequired, updateRecommended]
          additionalProperties: false
          properties:
            minimumSupportedVersionName:
              type: string
              example: 0.1.0
            minimumSupportedVersionCode:
              type: integer
              minimum: 0
              example: 1
            recommendedVersionName:
              type: string
              example: 0.1.0
            recommendedVersionCode:
              type: integer
              minimum: 0
              example: 1
            currentVersionCode:
              type: integer
              minimum: 0
              nullable: true
              example: 2
            updateRequired:
              type: boolean
            updateRecommended:
              type: boolean
    RobotBootstrapContentVersions:
      type: object
      required:
        [cacheVersion, tenantVersion, myCoursesVersion, publicCatalogVersion, myCoursesCount, publicCatalogCount]
      additionalProperties: false
      properties:
        cacheVersion:
          type: string
        tenantVersion:
          type: integer
        myCoursesVersion:
          type: string
        publicCatalogVersion:
          type: string
        myCoursesCount:
          type: integer
          minimum: 0
        publicCatalogCount:
          type: integer
          minimum: 0
    RobotBootstrapSyncMetadata:
      type: object
      required: [serverTime, syncedAt, idempotencyKey, configVersion, manifestHash]
      additionalProperties: false
      properties:
        serverTime:
          type: string
          format: date-time
        syncedAt:
          type: string
          format: date-time
        idempotencyKey:
          type: string
        configVersion:
          type: string
          description: Short stable manifest configuration version derived from the manifest hash.
          example: manifest-2a6a21d85d7d0b7c
        manifestHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 hash over stable manifest configuration fields.
    RobotSyncResponse:
      type: object
      required:
        [schemaVersion, manifestVersion, locked, tenant, license, capabilities, policies, contentVersions, sync]
      properties:
        schemaVersion:
          type: integer
          description: Bootstrap manifest schema version.
          example: 1
        manifestVersion:
          type: string
          description: Bootstrap manifest contract version. Android should branch on this value for offline cache parsing.
          example: 1.0.0
        locked:
          type: boolean
        reason:
          type: string
        tenant:
          $ref: "#/components/schemas/OrganizationContext"
        license:
          type: object
          additionalProperties: true
        capabilities:
          $ref: "#/components/schemas/RobotBootstrapCapabilities"
        policies:
          $ref: "#/components/schemas/RobotBootstrapPolicies"
        contentVersions:
          $ref: "#/components/schemas/RobotBootstrapContentVersions"
        sync:
          $ref: "#/components/schemas/RobotBootstrapSyncMetadata"
        organization:
          allOf:
            - $ref: "#/components/schemas/OrganizationContext"
          deprecated: true
          description: Backward-compatible alias of tenant. New clients should read tenant.
        entitlements:
          allOf:
            - $ref: "#/components/schemas/RobotEntitlements"
          deprecated: true
          description: Backward-compatible entitlement block. New clients should read capabilities.effective.
        myCourses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        publicCatalog:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        syncedAt:
          type: string
          format: date-time
          deprecated: true
          description: Backward-compatible alias of sync.syncedAt.
    RobotSyncChangesResponse:
      type: object
      required:
        [schemaVersion, manifestVersion, locked, currentManifestHash, currentConfigVersion, requiresFullSync, changed, sync]
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          example: 1
        manifestVersion:
          type: string
          example: 1.0.0
        locked:
          type: boolean
        reason:
          type: string
        currentManifestHash:
          type: string
          nullable: true
          pattern: "^[0-9a-f]{64}$"
        currentConfigVersion:
          type: string
          nullable: true
        requiresFullSync:
          type: boolean
        fullSyncReason:
          type: string
          enum: [MISSING_OR_UNSUPPORTED_CLIENT_VERSIONS]
        contentVersions:
          type: object
          allOf:
            - $ref: "#/components/schemas/RobotBootstrapContentVersions"
          nullable: true
        changed:
          type: object
          additionalProperties: false
          properties:
            tenant:
              $ref: "#/components/schemas/OrganizationContext"
            license:
              type: object
              additionalProperties: true
            capabilities:
              $ref: "#/components/schemas/RobotBootstrapCapabilities"
            policies:

  /robots:
    get:
      tags: [Robot]
      summary: List robots
      description: Lists robots visible to the current user. Super Admin can list all robots and receives protected license key display fields for the CMS masked/reveal UI. Organization users are scoped to their own organization and never receive license keys from this list API.
      parameters:
        - name: orgId
          in: query
          schema:
            type: integer
          description: Super Admin-only organization filter. Organization users are always scoped to their own tenant.
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/LicenseStatus"
          description: Filter by robot license status.
        - name: model
          in: query
          schema:
            $ref: "#/components/schemas/RobotHardwareModel"
          description: Filter by validated robot hardware model.
        - name: version
          in: query
          schema:
            type: string
            maxLength: 80
            pattern: "^[0-9A-Za-z._+() -]+$"
          example: 0.1.0
          description: Filter by stored Android app version.
        - name: lastSeenFrom
          in: query
          schema:
            type: string
            format: date-time
          description: Include robots last seen at or after this timestamp.
        - name: lastSeenTo
          in: query
          schema:
            type: string
            format: date-time
          description: Include robots last seen at or before this timestamp.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Maximum rows to return. Values above 100 are clamped by the backend.

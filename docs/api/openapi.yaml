    DashboardSection:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        key:
          type: string
        label:
          type: string
        path:
          type: string
        icon:
          type: string
          nullable: true
        sortOrder:
          type: integer
        requiredPermission:
          type: string
          nullable: true
        isSuperAdminOnly:
          type: boolean
        isActive:
          type: boolean
        templateType:
          type: string
          enum: [NONE, WIDGETS, KPI_OVERVIEW, MARKDOWN]
        templateConfig:
          type: object
          nullable: true
          additionalProperties: true
    CreateSectionRequest:
      type: object
      required: [key, label, path]
      properties:
        key:
          type: string
        label:
          type: string
        path:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer
        requiredPermission:
          type: string
        isSuperAdminOnly:
          type: boolean
        isActive:
          type: boolean
        templateType:
          type: string
        templateConfig:
          type: object
          additionalProperties: true
    UpdateSectionRequest:
      allOf:
        - $ref: '#/components/schemas/CreateSectionRequest'
    Notification:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        orgId:
          type: integer
          nullable: true
        userId:
          type: integer
          nullable: true
        type:
          type: string
        title:
          type: string
        message:
          type: string
        payload:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true

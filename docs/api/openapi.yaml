          maxLength: 80
          example: Sanbot
        androidApiLevel:
          type: integer
          example: 25
        abi:
          type: string
          enum: [arm64-v8a, armeabi-v7a]
        display:
          $ref: "#/components/schemas/RobotHardwareDisplay"
        capabilities:
          $ref: "#/components/schemas/RobotHardwareCapabilitySet"
    RobotDeviceProfileUpdateRequest:
      type: object
      required:
        [
          manufacturer,
          deviceModel,
          androidVersion,
          apiLevel,
          appVersionName,
          appVersionCode,
          hardwareProfile,
        ]
      additionalProperties: false
      properties:
        manufacturer:
          type: string
          minLength: 1
          maxLength: 80
          example: Sanbot
        deviceModel:
          type: string
          minLength: 1
          maxLength: 80
          example: Mini ELF
        androidVersion:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[0-9A-Za-z._ -]+$"
          example: 7.1.2
        apiLevel:
          type: integer
          minimum: 1
          example: 25
        appVersionName:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^[0-9A-Za-z._+-]+$"
          example: 0.1.0
        appVersionCode:
          type: integer
          minimum: 1
          example: 2
        hardwareProfile:
          $ref: "#/components/schemas/RobotHardwareProfile"
    RobotDeviceProfileUpdateResponse:
      type: object
      required: [robot, license, updatedAt]
      properties:
        robot:
          $ref: "#/components/schemas/Robot"
        license:
          type: object
          required: [status, validFrom, validUntil]
          properties:
            status:
              $ref: "#/components/schemas/LicenseStatus"
            validFrom:
              type: string
              format: date-time
            validUntil:
              type: string
              format: date-time
        updatedAt:
          type: string
          format: date-time
    RobotEnrollmentResponse:
      allOf:
        - $ref: "#/components/schemas/Robot"
        - type: object
          required: [licenseKey]
          properties:
            licenseKey:
              type: string
              minLength: 10
              maxLength: 10
              pattern: "^WHRB[0-9]{6}$"
              description: Activation license key generated during enrollment in WHRB plus six digits format.
            licenseKeyMasked:
              type: string
              nullable: true
              example: WHRB12...3456
    RobotCredentialRotationResponse:
      allOf:
        - $ref: "#/components/schemas/Robot"
        - type: object
          required: [licenseKey]
          properties:
            licenseKey:
              type: string
              minLength: 10
              maxLength: 10
              pattern: "^WHRB[0-9]{6}$"
              description: New activation license key generated during credential rotation. The previous key is no longer valid.
            licenseKeyMasked:
              type: string
              nullable: true
              example: WHRB12...3456

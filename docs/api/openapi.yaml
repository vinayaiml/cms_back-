          nullable: true
    CreatePermissionRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
        description:
          type: string
        category:
          type: string
    Robot:
      type: object
      description: Robot resource returned by administrative APIs. License keys are included only for authorized license viewers and should be masked by clients until explicitly revealed.
      properties:
        id:
          type: integer
        orgId:
          type: integer
        serialNumber:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
        name:
          type: string
          nullable: true
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        licenseStatus:
          $ref: '#/components/schemas/LicenseStatus'
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        appVersion:
          type: string
          nullable: true
          maxLength: 40
        deviceModel:
          type: string
          nullable: true
          deprecated: true
        licenseKey:
          type: string
          minLength: 10
          maxLength: 10
          pattern: '^WHRB[0-9]{6}$'
          description: Returned only to Super Admin in robot management responses. Organization users never receive this field from list APIs.
        licenseKeyMasked:
          type: string
          nullable: true
          example: WHRB12...3456
          description: Masked license key for Super Admin CMS display.
    CreateRobotRequest:
      type: object
      required: [serialNumber, validFrom, validUntil]
      additionalProperties: false
      properties:
        orgId:
          type: integer
        serialNumber:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
        name:
          type: string
          maxLength: 80
        validFrom:
          type: string
          format: date-time

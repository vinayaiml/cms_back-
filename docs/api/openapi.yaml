      type: object
      description: Robot resource returned by administrative APIs. License keys are included only for authorized license viewers and should be masked by clients until explicitly revealed.
      properties:
        id:
          type: integer
        orgId:
          type: integer
        serialNumber:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9._:-]+$"
        name:
          type: string
          nullable: true
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        licenseStatus:
          $ref: "#/components/schemas/LicenseStatus"
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        appVersion:
          type: string
          nullable: true
          maxLength: 40
        deviceModel:
          type: string
          nullable: true
          deprecated: true
        deviceMetadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Latest approved Android device profile metadata uploaded by the authenticated robot. It must not contain credentials, tokens or license keys.
        hardwareModel:
          type: string
          nullable: true
          enum: [MINI_ELF, ELF, NANO, S5]
        hardwareProfile:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RobotHardwareProfile"
          description: Validated robot hardware profile. This is metadata only; final entitlement and safety-policy resolution are handled by later CMS phases.
        hardwareCapabilities:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RobotHardwareCapabilitySet"
          description: Effective permitted capability set returned by CMS for the stored hardware profile. F03 disables safety-controlled capabilities.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        licenseKey:
          type: string
          minLength: 10
          maxLength: 10
          pattern: "^WHRB[0-9]{6}$"
          description: Returned only to Super Admin in robot management responses. Organization users never receive this field from list APIs.
        licenseKeyMasked:
          type: string
          nullable: true
          example: WHRB12...3456
          description: Masked license key for Super Admin CMS display.

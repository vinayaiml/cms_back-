            myCourses:
              type: array
              items:
                $ref: "#/components/schemas/Course"
            publicCatalog:
              type: array
              items:
                $ref: "#/components/schemas/Course"
        sync:
          $ref: "#/components/schemas/RobotBootstrapSyncMetadata"
